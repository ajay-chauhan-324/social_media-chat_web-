services:
  - type: web
    name: artroot-chat-api
    runtime: node
    plan: free
    # Backend only — the React client is hosted separately on Vercel.
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Your Vercel frontend URL — required for CORS and cross-site cookies,
      # e.g. https://your-app.vercel.app  (no trailing slash)
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Optional integrations — leave unset to run in mock mode.
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
